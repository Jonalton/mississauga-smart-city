# Cloud Build CI/CD — triggers on push to main.
# Substitutions required: _PROJECT_ID, _REGION, _REPO, _FIREBASE_PROJECT

substitutions:
  _PROJECT_ID: "PLACEHOLDER_PROJECT_ID"
  _REGION: "northamerica-northeast1"
  _REPO: "smart-city"
  _FIREBASE_PROJECT: "PLACEHOLDER_FIREBASE_PROJECT"

steps:
  # --- Build pipeline image ---
  - name: "gcr.io/cloud-builders/docker"
    id: build-pipeline
    args:
      - build
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/pipeline:$COMMIT_SHA"
      - ./pipeline

  # --- Build API image ---
  - name: "gcr.io/cloud-builders/docker"
    id: build-api
    args:
      - build
      - -t
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/api:$COMMIT_SHA"
      - ./api

  # --- Push images ---
  - name: "gcr.io/cloud-builders/docker"
    id: push-pipeline
    waitFor: [build-pipeline]
    args:
      - push
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/pipeline:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    id: push-api
    waitFor: [build-api]
    args:
      - push
      - "$_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/api:$COMMIT_SHA"

  # --- Deploy API to Cloud Run ---
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-api
    waitFor: [push-api]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - smart-city-api
      - --image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/api:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GCS_BUCKET_NAME=mississauga-smart-city-data,GOOGLE_CLOUD_PROJECT=$_PROJECT_ID

  # --- Update Cloud Run Job for pipeline ---
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: update-pipeline-job
    waitFor: [push-pipeline]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - smart-city-pipeline
      - --image=$_REGION-docker.pkg.dev/$_PROJECT_ID/$_REPO/pipeline:$COMMIT_SHA
      - --region=$_REGION
      - --set-env-vars=GCS_BUCKET_NAME=mississauga-smart-city-data,GOOGLE_CLOUD_PROJECT=$_PROJECT_ID

  # --- Build frontend ---
  - name: "node:20"
    id: build-frontend
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - "npm ci && VITE_API_BASE_URL=$(gcloud run services describe smart-city-api --region=$_REGION --format='value(status.url)') npm run build"

  # --- Deploy frontend to Firebase Hosting ---
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-frontend
    waitFor: [build-frontend]
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - "npm install -g firebase-tools && firebase deploy --only hosting --project=$_FIREBASE_PROJECT --token=$$FIREBASE_TOKEN"
    secretEnv: [FIREBASE_TOKEN]

availableSecrets:
  secretManager:
    - versionName: projects/$_PROJECT_ID/secrets/firebase-ci-token/versions/latest
      env: FIREBASE_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY

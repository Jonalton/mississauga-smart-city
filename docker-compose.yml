version: '3.9'

services:
  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    ports:
      - "4443:4443"
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    environment:
      - GCS_BUCKET_NAME=mississauga-smart-city-data
      - STORAGE_EMULATOR_HOST=http://fake-gcs:4443
      - GOOGLE_CLOUD_PROJECT=local-dev
      - PORT=8080
      - CACHE_REFRESH_MINUTES=5
    depends_on:
      fake-gcs:
        condition: service_healthy

  pipeline:
    build:
      context: ./pipeline
    environment:
      - GCS_BUCKET_NAME=mississauga-smart-city-data
      - STORAGE_EMULATOR_HOST=http://fake-gcs:4443
      - GOOGLE_CLOUD_PROJECT=local-dev
    depends_on:
      fake-gcs:
        condition: service_healthy
    profiles:
      - run-pipeline
